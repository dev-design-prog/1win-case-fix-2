server {
    listen 80;
    server_name bot.catup.lol;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bot.catup.lol;

    ssl_certificate /etc/letsencrypt/live/bot.catup.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.catup.lol/privkey.pem;

    root /var/www/winline/webapp;
    index index.html;

    # Serve static webapp files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Init-Data $http_x_init_data;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers "Content-Type, X-Init-Data";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    }
}
